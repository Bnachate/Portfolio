# Checks every pull request and every push to main: lint, types, unit/API/UI tests, production build, E2E tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push on the same branch cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned rather than ubuntu-latest: Playwright's --with-deps supports this release, and the
    # 26.04 image broke `apt-get update` (its Microsoft package source answers 403, unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: |
          # A broken third-party apt source must not block the system packages Playwright needs
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          npx playwright install --with-deps chromium

      # Starts its own server on port 3100 with a throwaway database (see playwright.config.ts)
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
